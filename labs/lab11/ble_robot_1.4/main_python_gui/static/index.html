<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Robot BLE Console</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <div id="app">
            <header>
                <h1>Robot Console</h1>
                <span id="status" class="disconnected">Disconnected</span>
            </header>
            <div id="main-content">
                <div id="dashboards">
                    <!-- PID Tuning Panel -->
                    <div class="panel" id="pid-panel">
                        <h2>PID Tuning</h2>
                        <div class="pid-fields">
                            <div class="pid-group">
                                <h3>Gains</h3>
                                <label data-pid="kp">
                                    <span class="pid-label">Kp</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0.8"
                                        data-committed="0.8"
                                    />
                                </label>
                                <label data-pid="ki">
                                    <span class="pid-label">Ki</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0"
                                        data-committed="0"
                                    />
                                </label>
                                <label data-pid="kd">
                                    <span class="pid-label">Kd</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0.15"
                                        data-committed="0.15"
                                    />
                                </label>
                            </div>
                            <div class="pid-group">
                                <h3>Setpoint</h3>
                                <label data-pid="setpoint">
                                    <span class="pid-label">Target (mm)</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="304"
                                        data-committed="304"
                                    />
                                </label>
                            </div>
                            <div class="pid-group">
                                <h3>Params</h3>
                                <label data-pid="cap">
                                    <span class="pid-label">I Cap</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0"
                                        data-committed="0"
                                    />
                                </label>
                                <label data-pid="range">
                                    <span class="pid-label">I Range</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0"
                                        data-committed="0"
                                    />
                                </label>
                                <label data-pid="rc">
                                    <span class="pid-label">D RC</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0"
                                        data-committed="0"
                                    />
                                </label>
                                <label data-pid="deadband">
                                    <span class="pid-label">Deadband</span>
                                    <input
                                        type="number"
                                        step="1"
                                        value="120"
                                        data-committed="120"
                                    />
                                </label>
                            </div>
                            <div class="pid-group">
                                <h3>Yaw Correction</h3>
                                <label data-pid="yaw_kp">
                                    <span class="pid-label">Yaw Kp</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="3.0"
                                        data-committed="3.0"
                                    />
                                </label>
                                <label data-pid="yaw_kd">
                                    <span class="pid-label">Yaw Kd</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0.5"
                                        data-committed="0.5"
                                    />
                                </label>
                            </div>
                        </div>
                        <div class="pid-actions">
                            <label data-pid="duration">
                                <span class="pid-label">Duration (ms)</span>
                                <input type="number" step="1" value="3000" />
                            </label>
                            <button id="pid-start">Start</button>
                            <button id="pid-stop" class="btn-danger">
                                Stop
                            </button>
                            <button id="pid-data">Get Data</button>
                        </div>
                    </div>

                    <!-- Kalman Panel -->
                    <div class="panel" id="kf-panel">
                        <h2>Kalman Filter</h2>
                        <div class="pid-fields">
                            <div class="pid-group">
                                <h3>Model</h3>
                                <label data-kf="drag">
                                    <span class="pid-label">Drag (1/s)</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0.31"
                                        data-committed="0.31"
                                    />
                                </label>
                                <label data-kf="momentum">
                                    <span class="pid-label">Momentum</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="8.84"
                                        data-committed="8.84"
                                    />
                                </label>
                            </div>
                            <div class="pid-group">
                                <h3>Noise</h3>
                                <label data-kf="sigma_1">
                                    <span class="pid-label"
                                        >Process pos (mm)</span
                                    >
                                    <input
                                        type="number"
                                        step="any"
                                        value="0.87"
                                        data-committed="0.87"
                                    />
                                </label>
                                <label data-kf="sigma_2">
                                    <span class="pid-label"
                                        >Process vel (mm/s)</span
                                    >
                                    <input
                                        type="number"
                                        step="any"
                                        value="172.5"
                                        data-committed="172.5"
                                    />
                                </label>
                                <label data-kf="sigma_3">
                                    <span class="pid-label"
                                        >Sensor ToF (mm)</span
                                    >
                                    <input
                                        type="number"
                                        step="any"
                                        value="1.8"
                                        data-committed="1.8"
                                    />
                                </label>
                            </div>
                        </div>
                        <div class="pid-actions">
                            <button id="kf-params">Send Params</button>
                            <button id="kf-reset" class="btn-danger">
                                Reset
                            </button>
                            <button id="kf-data">Get Data</button>
                        </div>
                    </div>

                    <!-- Step Response Panel -->
                    <div class="panel" id="step-panel">
                        <h2>Step Response</h2>
                        <div class="pid-fields">
                            <div class="pid-group">
                                <label data-step="pwm">
                                    <span class="pid-label">PWM</span>
                                    <input type="number" step="1" value="100" />
                                </label>
                                <label data-step="duration">
                                    <span class="pid-label">Duration (ms)</span>
                                    <input
                                        type="number"
                                        step="1"
                                        value="3000"
                                    />
                                </label>
                            </div>
                        </div>
                        <div class="pid-actions">
                            <button id="step-start">Start</button>
                            <button id="step-data">Get Data</button>
                        </div>
                    </div>

                    <!-- Stunts Panel -->
                    <div class="panel" id="stunt-panel">
                        <h2>Stunts</h2>
                        <div class="pid-fields">
                            <div class="pid-group">
                                <h3>Parameters</h3>
                                <label data-stunt="speed">
                                    <span class="pid-label">Speed</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="200"
                                        data-committed="200"
                                    />
                                </label>
                                <label data-stunt="trigger">
                                    <span class="pid-label">Trigger (mm)</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="914"
                                        data-committed="914"
                                    />
                                </label>
                                <label data-stunt="return_speed">
                                    <span class="pid-label">Return Speed</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="200"
                                        data-committed="200"
                                    />
                                </label>
                            </div>
                            <div class="pid-group">
                                <h3>Yaw Gains</h3>
                                <label data-stunt="yaw_kp">
                                    <span class="pid-label">Kp</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="4.0"
                                        data-committed="4.0"
                                    />
                                </label>
                                <label data-stunt="yaw_kd">
                                    <span class="pid-label">Kd</span>
                                    <input
                                        type="number"
                                        step="any"
                                        value="0.1"
                                        data-committed="0.1"
                                    />
                                </label>
                            </div>
                        </div>
                        <div class="pid-actions">
                            <label data-stunt="duration">
                                <span class="pid-label">Duration (ms)</span>
                                <input type="number" step="1" value="5000" />
                            </label>
                            <button id="stunt-drift">Drift</button>
                            <button id="stunt-flip">Flip</button>
                            <button id="stunt-stop" class="btn-danger">
                                Stop
                            </button>
                            <button id="stunt-data">Get Data</button>
                        </div>
                    </div>

                    <!-- Mapping Panel -->
                    <div class="panel" id="map-panel">
                        <h2>Mapping</h2>
                        <div class="pid-fields">
                            <div class="pid-group">
                                <h3>Settle</h3>
                                <label data-map="settle_threshold">
                                    <span class="pid-label"
                                        >Threshold (deg)</span
                                    >
                                    <input
                                        type="number"
                                        step="any"
                                        value="5"
                                        data-committed="5"
                                    />
                                </label>
                                <label data-map="settle_time">
                                    <span class="pid-label">Settle (ms)</span>
                                    <input
                                        type="number"
                                        step="1"
                                        value="300"
                                        data-committed="300"
                                    />
                                </label>
                                <label data-map="step_timeout">
                                    <span class="pid-label"
                                        >Step Timeout (ms)</span
                                    >
                                    <input
                                        type="number"
                                        step="1"
                                        value="4000"
                                        data-committed="4000"
                                    />
                                </label>
                            </div>
                            <div class="pid-group">
                                <h3>Sampling</h3>
                                <label data-map="samples_per_step">
                                    <span class="pid-label"
                                        >Samples / step</span
                                    >
                                    <input
                                        type="number"
                                        step="1"
                                        value="10"
                                        data-committed="10"
                                    />
                                </label>
                                <label data-map="angle_std">
                                    <span class="pid-label"
                                        >Angle std (deg)</span
                                    >
                                    <input
                                        type="number"
                                        step="any"
                                        value="10"
                                        data-committed="10"
                                    />
                                </label>
                            </div>
                        </div>
                        <div class="pid-actions">
                            <label data-map="num_steps">
                                <span class="pid-label">Steps</span>
                                <input type="number" step="1" value="36" />
                            </label>
                            <button id="map-start">Start</button>
                            <button id="map-stop" class="btn-danger">
                                Stop
                            </button>
                            <button id="map-data">Get Data</button>
                        </div>
                    </div>

                    <!-- Joystick Panel -->
                    <div class="panel" id="joystick-panel">
                        <h2>Drive</h2>
                        <div id="joystick-container">
                            <canvas
                                id="joystick"
                                width="200"
                                height="200"
                            ></canvas>
                        </div>
                        <div id="motor-readout">
                            <span>L: <span id="motor-l">0</span></span>
                            <span>R: <span id="motor-r">0</span></span>
                        </div>
                        <div id="wasd-hint">WASD to drive</div>
                    </div>
                </div>
                <div id="console-area">
                    <div id="chat-log"></div>
                    <div id="command-bar">
                        <select id="cmd-select">
                            <option value="">Select command...</option>
                        </select>
                        <div id="param-fields"></div>
                        <button id="btn-send" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="/static/app.js"></script>
    </body>
</html>

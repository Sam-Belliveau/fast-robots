# Lab 12 world + localization config.
#
# Units: meters everywhere.
# Coordinate frame: x right, y up, theta CCW from +x.
#
# Walls are line segments. Bounds are the localization grid extents.
# All Bayes filter / ray cache knobs live under `localization:` so the
# notebook and demo can stay zero-config.

world:
  bounds:
    min_x: -1.6764
    max_x:  1.9812
    min_y: -1.3716
    max_y:  1.3716

  lines:
    - (-1.6764, 0.1524), (-1.6764,-1.3716)
    - (-1.6764,-1.3716), ( 1.9812,-1.3716)
    - ( 1.9812,-1.3716), ( 1.9812, 1.3716)
    - ( 1.9812, 1.3716), (-0.7620, 1.3716)
    - (-0.7620, 1.3716), (-0.7620, 0.1524)
    - (-0.7620, 0.1524), (-1.6764, 0.1524)
    - ( 0.7620,-0.1524), ( 1.3716,-0.1524)
    - ( 1.3716,-0.1524), ( 1.3716, 0.4572)
    - ( 1.3716, 0.4572), ( 0.7620, 0.4572)
    - ( 0.7620, 0.4572), ( 0.7620,-0.1524)
    - (-0.1524,-1.3716), (-0.1524,-0.7620)
    - (-0.1524,-0.7620), ( 0.1524,-0.7620)
    - ( 0.1524,-0.7620), ( 0.1524,-1.3716)

localization:
  # 2D belief grid resolution. Cell size is derived from bounds.
  n_cells_x: 192
  n_cells_y: 144

  # Per-cell ray cache: rays at (360 / n_angles) deg, then circular
  # Gaussian smoothing on mean and squared distance.
  n_angles: 720
  smooth_sigma_deg: 8.0
  max_dist_m: 6.0

  # Sensor model. Combined in quadrature with the per-angle std from
  # the smoothed cache, so corner buckets get de-weighted automatically.
  sensor_sigma_mm: 32.0

  # On-board ToF saturates here (long-distance mode caps at ~2 m).
  # The update step clamps measurement + model to this value; the
  # corresponding (mean - sat)**2 variance inflation is baked into
  # the per-cell cache so a saturated reading is non-informative for
  # "could be anywhere beyond 2 m" cells.
  tof_sat_mm: 3500.0

  # Huber-style robust likelihood: cap |residual / std| at this many
  # standard deviations before squaring. Smaller = more tolerant of
  # outliers. 1.0 means a single bad reading can move the belief by
  # at most exp(-0.5) ~ 0.6 against a cell.
  robust_z_max: 4.0

  # Motion model. Predict step replaces the prior with an anisotropic
  # Gaussian centered at (belief_mean + v * dt), with the long axis
  # aligned to the measured heading. Bigger spread along heading
  # (distance traveled is uncertain), tight cross axis (gyro is
  # trusted).
  motion_long_sigma_per_m:   0.224
  # Per (PWM * second) longitudinal spread. Captures uncertainty in
  # the pwm_to_vel_mm_s mapping itself: at speed_pwm=70 for dt=0.1s,
  motion_long_sigma_per_pwm: 0.032
  motion_base_sigma_m:       0.032

  # PWM -> mm/s conversion used to project velocity from the
  # commanded speed. Calibrate against the actual step response
  # (~200 PWM -> ~2500 mm/s -> 12.5 mm/s per PWM).
  pwm_to_vel_mm_s: 10.0

  # Body-frame angles of the two ToF sensors.
  tof_sensor_angles_deg: [0.0, -90.0]

  # Flip recommended when the reversed-direction mean sensor std is
  # below this fraction of the forward mean std.
  flip_std_ratio: 0.0

controller:
  # Distance to a waypoint at which the controller advances to the
  # next one (mm). Lower = robot must drive closer before moving on.
  stop_radius_mm: 96.0
  # Inside this radius the flip-direction decision is frozen so the
  # controller does not chatter near a waypoint.
  stop_flip_radius_mm: 250.0
  # Forward drive PWM at full heading agreement. The actual command
  # is drive_pwm * coherence, where coherence is the magnitude of the
  # belief-weighted averaged unit-heading vector, so the robot slows
  # automatically in regions where contributing headings conflict.
  drive_pwm: 80.0
  # Heading error tolerance for "aligned" -- below this we drive,
  # and we re-evaluate the flip decision.
  align_tol_deg: 30.0
  # Low-pass RC (seconds) on the planning position. The belief mean is
  # jittery; smoothing here de-stutters the target bearing and the flip
  # decision. Set to 0 to disable.
  position_rc_s: 0.01
  # ToF distance-mode hysteresis (mm). Switch a sensor to LONG when the
  # belief-mean expected distance crosses tof_long_threshold_mm and back
  # to SHORT only when it falls below tof_short_threshold_mm.
  tof_long_threshold_mm: 1200.0
  tof_short_threshold_mm: 900.0
  # Spline path-following (SplineController) knobs. The spline is the
  # cubic-spline interpolant of `path`, arclength-parameterized in m.
  # look_ahead_m: pure-pursuit look-ahead from the path-projection point.
  # advance_window_m: a per-cell pass only counts if its arclength is in
  #   [s_prog, s_prog + advance_window_m]. Picks the lap consistent with
  #   current progress; without it, end-of-spline passes dominate.
  # wall_clearance_m: dynamic look-ahead is shortened so the targeted
  #   spline segment never gets within this distance of any wall.
  # spline_sample_step_m: dense-sample spacing along arclength.
  # s_prog_backoff_m: monotone progress lags the weighted nearest pass
  #   so a transient swing cannot ratchet past a sharp curve.
  look_ahead_m: 0.256
  advance_window_m: 0.512
  # heading_sigma_m: Gaussian sigma (m) on cell-to-spline distance.
  # Used both as the belief weighting kernel and as the tangent-vs-
  # toward-path blend factor (close => tangent, far => toward path).
  heading_sigma_m: 0.096
  wall_clearance_m: 0.016
  spline_sample_step_m: 0.0005
  s_prog_backoff_m: 0.064
  # heading_lookahead_m: how far past each cell's nearest spline point
  # to evaluate the spline tangent that defines the heading. Compensates
  # for actuation/BLE latency by aiming where the robot will be a moment
  # from now, not where it currently projects on the path.
  heading_lookahead_m: 0.096

simulation:
  # Drivetrain
  pwm_to_vel_mm_s: 8.0
  vel_tau_s: 0.30
  max_vel_mm_s: 3500.0
  # Heading PID model
  heading_tau_s: 0.20
  yaw_rate_max_dps: 360.0
  # Process noise
  vel_sigma_mm_s: 250.0
  # Heading bias is an OU process: steady-state sigma in degrees,
  # time constant in seconds. tau=120s with sigma=3deg models a gyro
  # offset that wanders by a few degrees over a couple of minutes,
  # not several degrees per second.
  heading_bias_sigma_deg: 1.0
  heading_bias_tau_s:     120.0
  heading_step_sigma_deg: 2.0
  # ToF sensor model
  tof_sigma_mm: 20.0
  tof_max_mm: 4000.0
  tof1_angle_deg: 0.0
  tof2_angle_deg: -90.0
  tof_rate_hz: 50.0
  tof_jitter_frac: 0.05
  # Timing
  physics_dt_s: 0.005
  ble_rtt_s: 0.10
  ble_rtt_jitter_s: 0.015
  # RNG seed for deterministic noise; null leaves the simulator unseeded.
  rng_seed: null

# Lab 12 world + localization config.
#
# Units: meters everywhere.
# Coordinate frame: x right, y up, theta CCW from +x.
#
# Walls are line segments. Bounds are the localization grid extents.
# All Bayes filter / ray cache knobs live under `localization:` so the
# notebook and demo can stay zero-config.

world:
  bounds:
    min_x: -1.6764
    max_x:  1.9812
    min_y: -1.3716
    max_y:  1.3716

  lines:
    - (-1.6764, 0.1524), (-1.6764,-1.3716)
    - (-1.6764,-1.3716), ( 1.9812,-1.3716)
    - ( 1.9812,-1.3716), ( 1.9812, 1.3716)
    - ( 1.9812, 1.3716), (-0.7620, 1.3716)
    - (-0.7620, 1.3716), (-0.7620, 0.1524)
    - (-0.7620, 0.1524), (-1.6764, 0.1524)
    - ( 0.7620,-0.1524), ( 1.3716,-0.1524)
    - ( 1.3716,-0.1524), ( 1.3716, 0.4572)
    - ( 1.3716, 0.4572), ( 0.7620, 0.4572)
    - ( 0.7620, 0.4572), ( 0.7620,-0.1524)
    - (-0.1524,-1.3716), (-0.1524,-0.7620)
    - (-0.1524,-0.7620), ( 0.1524,-0.7620)
    - ( 0.1524,-0.7620), ( 0.1524,-1.3716)

localization:
  # 2D belief grid resolution. Cell size is derived from bounds.
  n_cells_x: 192
  n_cells_y: 144

  # Per-cell ray cache: rays at (360 / n_angles) deg, then circular
  # Gaussian smoothing on mean and squared distance.
  n_angles: 720
  smooth_sigma_deg: 8.0
  max_dist_m: 6.0

  # Sensor model. Combined in quadrature with the per-angle std from
  # the smoothed cache, so corner buckets get de-weighted automatically.
  sensor_sigma_mm: 48.0

  # On-board ToF saturates here (long-distance mode caps at ~2 m).
  # The update step clamps measurement + model to this value; the
  # corresponding (mean - sat)**2 variance inflation is baked into
  # the per-cell cache so a saturated reading is non-informative for
  # "could be anywhere beyond 2 m" cells.
  tof_sat_mm: 2000.0

  # Huber-style robust likelihood: cap |residual / std| at this many
  # standard deviations before squaring. Smaller = more tolerant of
  # outliers. 1.0 means a single bad reading can move the belief by
  # at most exp(-0.5) ~ 0.6 against a cell.
  robust_z_max: 5.0

  # Motion model. Predict step replaces the prior with an anisotropic
  # Gaussian centered at (belief_mean + v * dt), with the long axis
  # aligned to the measured heading. Bigger spread along heading
  # (distance traveled is uncertain), tight cross axis (gyro is
  # trusted).
  motion_long_sigma_per_m:   0.256
  # Per (PWM * second) longitudinal spread. Captures uncertainty in
  # the pwm_to_vel_mm_s mapping itself: at speed_pwm=70 for dt=0.1s,
  motion_long_sigma_per_pwm: 0.032
  motion_base_sigma_m:       0.064

  # PWM -> mm/s conversion used to project velocity from the
  # commanded speed. Calibrate against the actual step response
  # (~200 PWM -> ~2500 mm/s -> 12.5 mm/s per PWM).
  pwm_to_vel_mm_s: 12.5

  # Body-frame angles of the two ToF sensors.
  tof_sensor_angles_deg: [0.0, -90.0]

  # Flip recommended when the reversed-direction mean sensor std is
  # below this fraction of the forward mean std.
  flip_std_ratio: 0.2

controller:
  # Distance to a waypoint at which the controller advances to the
  # next one (mm). Lower = robot must drive closer before moving on.
  stop_radius_mm: 96.0
  # Forward drive PWM when aligned with the target bearing.
  speed_pwm: 50.0
  # Heading error tolerance for "aligned" -- below this we drive,
  # and we re-evaluate the flip decision.
  align_tol_deg: 20.0

simulation:
  # Drivetrain
  pwm_to_vel_mm_s: 10.0
  vel_tau_s: 0.30
  max_vel_mm_s: 3500.0
  # Heading PID model
  heading_tau_s: 0.20
  yaw_rate_max_dps: 360.0
  # Process noise
  vel_sigma_mm_s: 250.0
  # Heading bias is an OU process: steady-state sigma in degrees,
  # time constant in seconds. tau=120s with sigma=3deg models a gyro
  # offset that wanders by a few degrees over a couple of minutes,
  # not several degrees per second.
  heading_bias_sigma_deg: 3.0
  heading_bias_tau_s:     120.0
  heading_step_sigma_deg: 2.0
  # ToF sensor model
  tof_sigma_mm: 20.0
  tof_max_mm: 2390.0
  tof1_angle_deg: 0.0
  tof2_angle_deg: -90.0
  tof_rate_hz: 50.0
  tof_jitter_frac: 0.10
  # Timing
  physics_dt_s: 0.005
  ble_rtt_s: 0.10
  ble_rtt_jitter_s: 0.015
